# Welcome to Jekyll!
#
# This config file is meant for settings that affect your entire site, values
# which you are expected to set up once and rarely need to edit after that.
# For technical reasons, this file is *NOT* reloaded automatically when you use
# `jekyll serve`. If you change this file, please restart the server process.

# minimal_mistakes_skin    : "dark" # "air", "aqua", "contrast", "dark", "dirt", "neon", "mint", "plum", "sunrise"

# Site Settings
locale                   : "en-US"
title                    : "Sagnik Kumar Gupta"
title_separator          : "-"
name                     : &name "Sagnik Kumar Gupta"
description              : &description "Assistant Professor, Amrut Mody School of Management, Ahmedabad University"
url                      : https://sagnik-kr-gupta.github.io
baseurl                  : "" # the subpath of your site, e.g. "/blog"
repository               : "Sagnik-Kr-Gupta/sagnik-kr-gupta.github.io" # <-- PUT YOUR GITHUB REPO HERE
teaser                   :  # filename of teaser fallback teaser image placed in /images/, e.g. "500x300.png"
breadcrumbs              : false
words_per_minute         : 160
future                   : true
read_more                : "disabled"
talkmap_link             : false
comments:
  provider               : # false (default), "disqus", "discourse", "facebook", "google-plus", "staticman", "custom"
  disqus:
    shortname            : # <-- PUT YOUR DISQUS SHORTNAME HERE
  discourse:
    server               : # <-- PUT YOUR DISCOURSE SERVER LINK HERE
  facebook:
    appid                : # <-- PUT YOUR FACEBOOK APP ID HERE
    num_posts            : 
    colorscheme          : 
staticman:
  allowedFields          : ['name', 'email', 'url', 'message']
  branch                 : "gh-pages"
  commitMessage          : "New comment."
  filename               : comment-{@timestamp}
  format                 : "yml"
  moderation             : true
  path                   : "_data/comments/{options.slug}"
  requiredFields         : ['name', 'email', 'message']
  transforms:
    email                : "md5"
  generatedFields:
    date:
      type               : "date"
      options:
        format           : "iso8601"
atom_feed:
  path                   : # <-- LEAVE BLANK OR SPECIFY FEED PATH

# SEO Related
google_site_verification :
bing_site_verification   :
alexa_site_verification  :
yandex_site_verification :

# Social Sharing
twitter:
  username               : SagnikKGupta
# facebook:
#   username               : YOUR_FACEBOOK_USERNAME # <-- OPTIONAL
#   app_id                 :
#   publisher              :
og_image                 :  # <-- PUT DEFAULT OG IMAGE IF YOU WANT
social:
  type                   : Person
  name                   : "Sagnik Kumar Gupta"
  links: # <-- PUT ARRAY OF SOCIAL LINKS HERE
    # - platform: "linkedin"
    #   url: "https://www.linkedin.com/in/sagnik-kumar-gupta/" 

# Site Author
author:
  name             : "Sagnik Kumar Gupta"
  avatar           : "profile.jpg"
  bio              : "PhD Research Scholar"
  location         : "Hyderabad, India"
  employer         :  "IIT Hyderabad"
  pubmed           : # <-- PUT PUBMED LINK IF ANY
  googlescholar    : "https://scholar.google.com/citations?user=TkVX_pcAAAAJ&hl=en"
  email            : la24resch11001@iith.ac.in
  researchgate     : 
  uri              :
  bitbucket        :
  codepen          :
  dribbble         :
  flickr           :
#   facebook         : "YOUR_FACEBOOK_USERNAME"
  foursquare       :
#  github           : "YOUR_GITHUB_USERNAME" # <-- PUT YOUR GITHUB USERNAME
  google_plus      :
  keybase          :
#   instagram        : "YOUR_INSTAGRAM_USERNAME"
  impactstory      : #"https://profiles.impactstory.org/u/xxxx-xxxx-xxxx-xxxx"
  lastfm           :
  linkedin         : "YOUR_LINKEDIN_LINK" # <-- PUT LINKEDIN LINK
  orcid            : # <-- PUT ORCID LINK
  pinterest        :
  soundcloud       :
#   stackoverflow    : YOUR_STACKOVERFLOW_LINK
  steam            :
  tumblr           :
  twitter          : "SagnikKGupta"
  vine             :
  weibo            :
  xing             :
  youtube          :
  wikipedia        :

# Reading Files
include:
  - .htaccess
  - _pages
  - files
exclude:
  - "*.sublime-project"
  - "*.sublime-workspace"
  - .asset-cache
  - .bundle
  - .jekyll-assets-cache
  - .sass-cache
  - CHANGELOG
  - Capfile
  - Gemfile
  - Gruntfile.js
  - LICENSE
  - README
  - Rakefile
  - assets/js/_main.js
  - assets/js/plugins
  - assets/js/vendor
  - config
  - gulpfile.js
  - log
  - node_modules
  - package.json
  - tmp
  - vendor
keep_files:
  - .git
  - .svn
encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"

# Conversion
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false

# Markdown Processing
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false

# Collections
collections:
  teaching:
    output: true
    permalink: /:collection/:path/
  publications:
    output: true
    permalink: /:collection/:path/
  portfolio:
    output: true
    permalink: /:collection/:path/
  talks:
    output: true
    permalink: /:collection/:path/

# Defaults
defaults:
  # _posts
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: true
      share: true
      related: true
  # _pages
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true
  # _teaching
  - scope:
      path: ""
      type: teaching
    values:
      layout: single
      author_profile: true
      share: true
      comments: true
  # _publications
  - scope:
      path: ""
      type: publications
    values:
      layout: single
      author_profile: true
      share: true
      comments: true
  # _portfolio
  - scope:
      path: ""
      type: portfolio
    values:
      layout: single
      author_profile: true
      share: true
      comment: true
  # _talks
  - scope:
      path: ""
      type: talks
    values:
      layout: talk
      author_profile: true
      share: true

# Sass/SCSS
sass:
  sass_dir: _sass
  style: compressed

# Outputting
permalink: /:categories/:title/
timezone: America/Los_Angeles

# Plugins
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jekyll-redirect-from
whitelist:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jemoji

# Archives
category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/

# HTML Compression
compress_html:
  clippings: all
  ignore:
    envs: development

theme: jekyll-theme-midnight

